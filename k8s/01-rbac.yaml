apiVersion: v1
kind: ServiceAccount
metadata:
  name: containment-runner
  namespace: containment-sandbox
  labels:
    app.kubernetes.io/part-of: containment
    app.kubernetes.io/component: sandbox-runner
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: containment-sandbox-manager
  namespace: containment-sandbox
  labels:
    app.kubernetes.io/part-of: containment
    app.kubernetes.io/component: sandbox-runner
rules:
  # Pod lifecycle management within the sandbox namespace
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "delete"]
  # Pod execution & log streaming for interactive command evaluation
  - apiGroups: [""]
    resources: ["pods/exec", "pods/log", "pods/status"]
    verbs: ["create", "get"]
  # Resource quota & limit range inspection
  - apiGroups: [""]
    resources: ["resourcequotas", "limitranges"]
    verbs: ["get", "list"]
  # Dynamic egress network policy management (reflecting policy allowed_hosts)
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: containment-sandbox-manager-binding
  namespace: containment-sandbox
  labels:
    app.kubernetes.io/part-of: containment
    app.kubernetes.io/component: sandbox-runner
subjects:
  - kind: ServiceAccount
    name: containment-runner
    namespace: containment-sandbox
roleRef:
  kind: Role
  name: containment-sandbox-manager
  apiGroup: rbac.authorization.k8s.io
