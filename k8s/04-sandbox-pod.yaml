apiVersion: v1
kind: Pod
metadata:
  name: sandbox-agent-template
  namespace: containment-sandbox
  labels:
    app.kubernetes.io/part-of: containment
    app.kubernetes.io/component: sandbox-instance
    containment.dev/sandbox: "true"
spec:
  # Optional gVisor / Kata isolation runtime class (can be enabled if configured on node)
  # runtimeClassName: gvisor
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: sandbox-agent
      image: node:20-slim
      command: ["/bin/sh", "-c", "sleep 3600"]
      workingDir: /workspace
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      resources:
        requests:
          cpu: 250m
          memory: 256Mi
          ephemeral-storage: 512Mi
        limits:
          cpu: 1000m
          memory: 1024Mi
          ephemeral-storage: 2Gi
      volumeMounts:
        # Isolated writable workspace volume
        - name: workspace-volume
          mountPath: /workspace
        # Ephemeral temp directory for builds and package caches
        - name: tmp-volume
          mountPath: /tmp
  volumes:
    - name: workspace-volume
      emptyDir:
        sizeLimit: 2Gi
    - name: tmp-volume
      emptyDir:
        sizeLimit: 1Gi
