<svg width="64" height="64" viewBox="0 -5 108 106" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sbFirewallRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="sbBoxLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B" />
      <stop offset="100%" stop-color="#0F0F11" />
    </linearGradient>
    <linearGradient id="sbBoxRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#222226" />
      <stop offset="100%" stop-color="#141417" />
    </linearGradient>
    <linearGradient id="escapeRedGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F87171" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>
  </defs>

  <!-- Sandbox Left Wall -->
  <path d="M 14 46 L 44 62 L 44 88 L 14 72 Z" fill="url(#sbBoxLeft)" stroke="#3F3F46" stroke-width="2.5" stroke-linejoin="round"/>
  
  <!-- Sandbox Right Wall -->
  <path d="M 44 62 L 74 46 L 74 72 L 44 88 Z" fill="url(#sbBoxRight)" stroke="#3F3F46" stroke-width="2.5" stroke-linejoin="round"/>
  
  <!-- Sandbox Top Rim (Firewall perimeter) -->
  <path d="M 44 30 L 74 46 L 44 62 L 14 46 Z" fill="#27272A" stroke="url(#sbFirewallRim)" stroke-width="3.2" stroke-linejoin="round"/>
  
  <!-- Recessed Sandbox Chamber Void -->
  <path d="M 44 38 L 64 48 L 44 58 L 24 48 Z" fill="#09090B" stroke="#3F3F46" stroke-width="1.2" stroke-linejoin="round"/>
  
  <!-- Internal Containment Ring -->
  <ellipse cx="44" cy="48" rx="12" ry="6.5" stroke="#F59E0B" stroke-width="1.2" stroke-dasharray="2.5 2" stroke-opacity="0.85" fill="none"/>
  
  <!-- Escape Trajectory -->
  <path d="M 44 48 C 50 36, 56 24, 68 18" stroke="url(#escapeRedGrad)" stroke-width="2.8" stroke-dasharray="4 3" stroke-linecap="round" fill="none"/>
  
  <!-- Escaping Bot Badge -->
  <rect x="64" y="4" width="28" height="25" rx="6" fill="#18181B" stroke="url(#escapeRedGrad)" stroke-width="2.6"/>
  <line x1="78" y1="8" x2="78" y2="10.5" stroke="#EF4444" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="78" cy="7.5" r="1.2" fill="#EF4444"/>
  <rect x="71" y="11" width="14" height="11" rx="2.5" stroke="#EF4444" stroke-width="2.2" fill="#EF4444" fill-opacity="0.15"/>
  <circle cx="75" cy="16.5" r="1.2" fill="#EF4444"/>
  <circle cx="81" cy="16.5" r="1.2" fill="#EF4444"/>
  <line x1="69" y1="16" x2="71" y2="16" stroke="#EF4444" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="85" y1="16" x2="87" y2="16" stroke="#EF4444" stroke-width="2.2" stroke-linecap="round"/>
</svg>
